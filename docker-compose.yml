services:

  # ── Frontend ──────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    env_file:
      - ./.env
    networks:
      - app-network
    depends_on:
      - backend

  # ── Backend (Node + Express) ──────────────────
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - uploads-data:/app/uploads
    env_file:
      - ./.env
    networks:
      - app-network
      - supabase_network_semantic-vault
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  # ── Python FastAPI ────────────────────────────
  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service:/app
      - uploads-data:/app/uploads
    env_file:
      - ./.env
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy

  # ── Celery Worker ─────────────────────────────
  celery-worker:
    build: ./ai-service
    command: >
      celery -A celery_app worker
      --loglevel=info
      --concurrency=2
    volumes:
      - ./ai-service:/app
      - uploads-data:/app/uploads
    env_file:
      - ./.env
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy

  # ── Redis ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Qdrant Vector DB ──────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

  supabase_network_semantic-vault:
    external: true

volumes:
  redis-data:
  qdrant-data:
  uploads-data: